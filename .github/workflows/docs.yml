name: Deploy dbt docs

# Manual trigger. Before the first run, set Settings -> Pages -> Source to
# "GitHub Actions"; afterwards, switch the trigger to `push: branches: [main]`
# if you want docs redeployed on every merge.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt
      - run: python scripts/generate_data.py
      - run: dbt build
      - run: dbt docs generate --static

      - name: Stage site
        run: mkdir site && cp target/static_index.html site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
